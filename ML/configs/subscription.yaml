# configs/subscription.yaml

dataset_name: subscription

# =========================
# Dataset identification
# =========================
id_column: CustomerID
target_column: Churn
positive_class: 1
negative_class: 0

# =========================
# Feature definitions
# =========================

categorical_features:
  - SubscriptionType
  - PaymentMethod
  - PaperlessBilling
  - ContentType
  - GenrePreference
  - Gender
  - ParentalControl
  - SubtitlesEnabled
  - MultiDeviceAccess
  - DeviceRegistered

numerical_features:
  - AccountAge
  - MonthlyCharges
  - TotalCharges
  - ViewingHoursPerWeek
  - AverageViewingDuration
  - ContentDownloadsPerMonth
  - UserRating
  - SupportTicketsPerMonth
  - WatchlistSize

# =========================
# Actionable feature groups
# (used by actions.py & simulate.py)
# =========================

actionable_features:
  pricing:
    - MonthlyCharges

  engagement:
    - ViewingHoursPerWeek
    - AverageViewingDuration
    - WatchlistSize
    - ContentDownloadsPerMonth
    - UserRating

  support:
    - SupportTicketsPerMonth

  subscription:
    - SubscriptionType

  experience:
    - MultiDeviceAccess
    - DeviceRegistered
    - SubtitlesEnabled

# =========================
# Risk thresholds
# =========================

risk_thresholds:
  low: 0.3
  medium: 0.6
  high: 0.7

# =========================
# Retention actions metadata
# =========================

retention_actions:
  pricing:
    action: "Offer discounted subscription or limited-time price reduction"
    expected_churn_reduction: 0.15

  engagement:
    action: "Recommend personalized content and increase user engagement"
    expected_churn_reduction: 0.18

  support:
    action: "Provide proactive customer support outreach"
    expected_churn_reduction: 0.14

  subscription:
    action: "Upgrade or adjust subscription plan with added benefits"
    expected_churn_reduction: 0.12

  experience:
    action: "Enable enhanced viewing experience features"
    expected_churn_reduction: 0.10
